{% extends "base.html" %}
{% block title %}{{ _('Log in') }} — {{ _('Dossier') }}{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>{{ _('Log in') }}</h1>
  {% if error %}
  <p class="flash-error">{{ error }}</p>
  {% endif %}
  <form method="post" action="{{ url_for('auth.login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label for="email">{{ _('Email') }}</label>
      <input type="email" id="email" name="email" value="{{ email or '' }}" required autocomplete="email">
    </div>
    <div class="form-group">
      <label for="password">{{ _('Password') }}</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary" style="min-height: var(--touch-min);">{{ _('Log in') }}</button>
    </div>
  </form>
  <p class="form-link">{{ _("Don't have an account?") }} <a href="{{ url_for('auth.register') }}">{{ _('Register') }}</a></p>
</div>
{% endblock %}
