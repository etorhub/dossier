{% extends "base.html" %}
{% block title %}{{ _('Register') }} — {{ _('Dossier') }}{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>{{ _('Register') }}</h1>
  {% if error %}
  <p class="flash-error">{{ error }}</p>
  {% endif %}
  <form method="post" action="{{ url_for('auth.register') }}">
    <div class="form-group">
      <label for="email">{{ _('Email') }}</label>
      <input type="email" id="email" name="email" value="{{ email or '' }}" required autocomplete="email">
    </div>
    <div class="form-group">
      <label for="password">{{ _('Password (at least 8 characters)') }}</label>
      <input type="password" id="password" name="password" required autocomplete="new-password" minlength="8">
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary" style="min-height: var(--touch-min);">{{ _('Register') }}</button>
    </div>
  </form>
  <p class="form-link">{{ _('Already have an account?') }} <a href="{{ url_for('auth.login') }}">{{ _('Log in') }}</a></p>
</div>
{% endblock %}
