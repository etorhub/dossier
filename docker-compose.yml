services:
  # Ollama + ollama-init use profile local-llm. Copy .env.example → .env (sets
  # COMPOSE_PROFILES=local-llm) or pass --profile local-llm. Without it, point
  # OLLAMA_HOST at host Ollama (see .env.example).
  #
  # Default config targets a local GPU machine (RTX 4070 or similar, 12 GB VRAM):
  #   LLM:        qwen2.5:14b  (~8.7 GB Q4, fits in VRAM)
  #   Embeddings: bge-m3       (MTEB #1 multilingual, 1024-dim)
  #
  # NAS production (UGreen DSP 2800): no Ollama — set LLM_PROVIDER=vllm and
  # EMBED_PROVIDER=vllm with Modal endpoint URLs (see docs/MODAL_GPU_BACKEND.md).
  # Local dev: COMPOSE_PROFILES=local-llm starts Ollama in Docker.
  ollama:
    profiles: ["local-llm"]
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: "2"
      OLLAMA_MAX_LOADED_MODELS: "1"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ollama-init:
    profiles: ["local-llm"]
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      DOSSIER_LLM_MODEL: ${DOSSIER_LLM_MODEL:-qwen2.5:14b}
    entrypoint:
      [
        "sh",
        "-c",
        "set -eu && echo \"ollama-init: pulling $$DOSSIER_LLM_MODEL and bge-m3 (first start can take a while)...\" && ollama pull $$DOSSIER_LLM_MODEL && ollama pull bge-m3 && echo 'ollama-init: pulls complete.'",
      ]
    restart: "no"

  db:
    image: pgvector/pgvector:pg18
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_DB: dossier
      POSTGRES_USER: dossier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    # Loopback-only: reachable from the host itself (local dev tools via
    # localhost:5432, or on the NAS a cloudflared process proxying a Tunnel
    # TCP route — see docs/REMOTE_REWRITE.md) but never from the LAN/WAN.
    # DB_HOST_PORT overrides the host-side port (default 5432) if it collides
    # with another Postgres instance already bound to loopback on the host.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dossier"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-init:
    # Pulled from GHCR by default (published by .github/workflows/publish.yml).
    # Local dev rebuilds from source — docker-compose.override.yml adds the build: directive.
    image: ghcr.io/etorhub/dossier-web:${DOSSIER_TAG:-latest}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dossier:${POSTGRES_PASSWORD:-devpassword}@db:5432/dossier
    command: alembic upgrade head
    restart: "no"

  web:
    image: ghcr.io/etorhub/dossier-web:${DOSSIER_TAG:-latest}
    ports:
      - "5000:5000"
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://dossier:${POSTGRES_PASSWORD:-devpassword}@db:5432/dossier
      POSTGRES_HOST: db
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
    volumes:
      - ./config:/app/config
    command: sh -c "flask seed-sources && gunicorn -b 0.0.0.0:5000 app:application"

  worker:
    image: ghcr.io/etorhub/dossier-worker:${DOSSIER_TAG:-latest}
    depends_on:
      db-init:
        condition: service_completed_successfully
      # When profile local-llm is off, this dependency is skipped (required: false).
      ollama-init:
        condition: service_completed_successfully
        required: false
    environment:
      DATABASE_URL: postgresql://dossier:${POSTGRES_PASSWORD:-devpassword}@db:5432/dossier
      POSTGRES_HOST: db
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./config:/app/config
      - ./data/job_runs:/app/data/job_runs
    command: python -m app.scheduler

  ops:
    # Reuses the web image; the command below runs the ops dashboard instead.
    image: ghcr.io/etorhub/dossier-web:${DOSSIER_TAG:-latest}
    ports:
      - "5001:5001"
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://dossier:${POSTGRES_PASSWORD:-devpassword}@db:5432/dossier
      POSTGRES_HOST: db
    volumes:
      - ./config:/app/config
      - ./data/job_runs:/app/data/job_runs
    command: gunicorn -b 0.0.0.0:5001 ops:application

volumes:
  pgdata:
  ollama_data:
