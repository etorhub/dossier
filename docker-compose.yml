services:
  # Ollama + ollama-init use profile local-llm. Copy .env.example → .env (sets
  # COMPOSE_PROFILES=local-llm) or pass --profile local-llm. Without it, point
  # OLLAMA_HOST at host Ollama (see .env.example).
  #
  # Tuned for CPU-only inference on a NAS (UGreen DSP 2800): a single thread pool
  # and one resident model keep peak RAM low — the daily job never runs the
  # rewrite (qwen2.5:3b) and embedding (paraphrase-multilingual) models concurrently.
  ollama:
    profiles: ["local-llm"]
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ollama-init:
    profiles: ["local-llm"]
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint:
      [
        "sh",
        "-c",
        "set -eu && echo 'ollama-init: pulling qwen2.5:3b and paraphrase-multilingual (first start can take a while)...' && ollama pull qwen2.5:3b && ollama pull paraphrase-multilingual && echo 'ollama-init: pulls complete.'",
      ]
    restart: "no"

  db:
    image: pgvector/pgvector:pg18
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_DB: dossier
      POSTGRES_USER: dossier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dossier"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-init:
    build:
      context: .
      target: web
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://dossier:${POSTGRES_PASSWORD:-devpassword}@db:5432/dossier
    command: alembic upgrade head
    restart: "no"

  web:
    build:
      context: .
      target: web
    ports:
      - "5000:5000"
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://dossier:${POSTGRES_PASSWORD:-devpassword}@db:5432/dossier
      POSTGRES_HOST: db
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
    volumes:
      - ./config:/app/config
    command: sh -c "flask seed-sources && gunicorn -b 0.0.0.0:5000 app:application"

  worker:
    build:
      context: .
      target: worker
    depends_on:
      db-init:
        condition: service_completed_successfully
      # When profile local-llm is off, this dependency is skipped (required: false).
      ollama-init:
        condition: service_completed_successfully
        required: false
    environment:
      DATABASE_URL: postgresql://dossier:${POSTGRES_PASSWORD:-devpassword}@db:5432/dossier
      POSTGRES_HOST: db
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./config:/app/config
      - ./data/job_runs:/app/data/job_runs
    command: python -m app.scheduler

  ops:
    build:
      context: .
      target: web
    ports:
      - "5001:5001"
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://dossier:${POSTGRES_PASSWORD:-devpassword}@db:5432/dossier
      POSTGRES_HOST: db
    volumes:
      - ./config:/app/config
      - ./data/job_runs:/app/data/job_runs
    command: gunicorn -b 0.0.0.0:5001 ops:application

volumes:
  pgdata:
  ollama_data:
