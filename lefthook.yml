pre-commit:
  commands:
    ruff-check:
      glob: "*.py"
      run: uv run ruff check --fix {staged_files}
      stage_fixed: true
      env:
        RUFF_CACHE_DIR: /tmp/ruff-cache
    ruff-format:
      glob: "*.py"
      run: uv run ruff format --check {staged_files}
      env:
        RUFF_CACHE_DIR: /tmp/ruff-cache

pre-push:
  commands:
    pytest:
      run: uv run pytest

commit-msg:
  commands:
    commitizen:
      run: uv run cz check --commit-msg-file {1}
