[project]
name = "dossier"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "ollama",
    "flask",
    "trafilatura",
    "psycopg2-binary",
    "apscheduler",
    "feedparser",
    "httpx",
    "python-dotenv",
    "bcrypt",
    "alembic",
    "sqlalchemy",
    "gunicorn",
    "PyYAML",
    "humanize>=4.15.0",
    "Flask-Babel",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "commitizen",
    "types-PyYAML",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

# Flask and Click decorators lack complete type stubs — suppress the resulting
# untyped-decorator noise in route and CLI modules rather than cluttering
# every @bp.get / @click.command with individual type: ignore comments.
[[tool.mypy.overrides]]
module = [
    "app.__init__",
    "app.cli",
    "app.worker_cli",
    "app.routes.auth",
    "app.routes.pwa",
    "app.routes.reader",
    "app.routes.settings",
    "app.routes.setup",
]
disable_error_code = ["untyped-decorator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
