name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push ARM64 images
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target: [web, worker, ops]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (ARM64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR_TOKEN must be a classic PAT with write:packages scope.
      # Create one at https://github.com/settings/tokens and store it as
      # a repository secret named GHCR_TOKEN.
      # GITHUB_TOKEN cannot push to packages whose name differs from the
      # repository name (dossier-web ≠ dossier), so a PAT is required.
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push ${{ matrix.target }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/dossier-${{ matrix.target }}:latest
          provenance: false
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
