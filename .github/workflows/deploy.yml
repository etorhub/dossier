name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push ARM64 images
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Each target becomes a tag on the single ghcr.io/etorhub/dossier package.
        # The package name matches the repository name so GITHUB_TOKEN has automatic
        # write access without any manual package-linking step.
        target: [web, worker, ops]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (ARM64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.target }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          # Tag format: ghcr.io/etorhub/dossier:web  (package name = repo name)
          tags: ghcr.io/${{ github.repository }}:${{ matrix.target }}
          provenance: false
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
