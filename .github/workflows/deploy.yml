name: CI and deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    name: Lint, type check, test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-web.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-web.txt
          pip install ruff mypy pytest types-PyYAML

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app/

      - name: Test (pytest)
        run: pytest

  build-and-push:
    name: Build and push ARM64 images
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (ARM64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build base stage first and cache it — both web and worker inherit from it.
      - name: Prime base layer cache
        uses: docker/build-push-action@v6
        with:
          context: .
          target: base
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=dossier-base
          cache-to: type=gha,scope=dossier-base,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/dossier-web:latest
          cache-from: |
            type=gha,scope=dossier-base
            type=gha,scope=dossier-web
          cache-to: type=gha,scope=dossier-web,mode=max

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/dossier-worker:latest
          cache-from: |
            type=gha,scope=dossier-base
            type=gha,scope=dossier-worker
          cache-to: type=gha,scope=dossier-worker,mode=max
