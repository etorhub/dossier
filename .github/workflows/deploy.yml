name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and push ARM64 images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (ARM64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build base stage first and cache it — web, worker, and ops all inherit from it.
      - name: Prime base layer cache
        uses: docker/build-push-action@v6
        with:
          context: .
          target: base
          platforms: linux/arm64
          push: false
          provenance: false
          cache-from: type=gha,scope=dossier-base
          cache-to: type=gha,scope=dossier-base,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/dossier-web:latest
          provenance: false
          cache-from: |
            type=gha,scope=dossier-base
            type=gha,scope=dossier-web
          cache-to: type=gha,scope=dossier-web,mode=max

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/dossier-worker:latest
          provenance: false
          cache-from: |
            type=gha,scope=dossier-base
            type=gha,scope=dossier-worker
          cache-to: type=gha,scope=dossier-worker,mode=max

      - name: Build and push ops image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ops
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/dossier-ops:latest
          provenance: false
          cache-from: |
            type=gha,scope=dossier-base
            type=gha,scope=dossier-ops
          cache-to: type=gha,scope=dossier-ops,mode=max
