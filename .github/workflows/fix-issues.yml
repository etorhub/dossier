name: Fix GitHub Issues

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# Use the job token for checkout, push, PRs, and gh — no separate GH_TOKEN secret required.
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v4

      - name: Install project dependencies
        run: uv sync --extra dev

      - name: Install lefthook hooks
        run: uv run lefthook install

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Configure git
        run: |
          git config user.name "Claude Code"
          git config user.email "noreply@anthropic.com"
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/etorhub/dossier.git

      - name: Write agent prompt
        run: |
          cat > /tmp/agent-prompt.txt << 'PROMPT'
          You are an autonomous bug-fix agent for the etorhub/dossier GitHub repo. Follow every step below exactly. Do not ask for confirmation. Stop and exit cleanly if any guard condition is met.

          ## Step 1 — Find the oldest open bug

          Run:
            gh issue list --repo etorhub/dossier --label bug --state open --limit 30 --json number,title,body,comments,labels,url

          Pipe that output to:
            python3 -c "
          import json, sys
          issues = json.load(sys.stdin)
          if not issues:
              print('NO_ISSUES')
              sys.exit(0)
          oldest = sorted(issues, key=lambda x: x['number'])[0]
          print(json.dumps(oldest))
          "

          If output is NO_ISSUES, print "Nothing to do — no open bugs." and stop.

          Parse the JSON to get: NUMBER, TITLE, BODY.

          ## Step 2 — Guard: skip if a PR already exists

          Run (substitute the real issue number for NUMBER):
            gh pr list --repo etorhub/dossier --state open --search "Closes #NUMBER" --json number,title

          Pipe to:
            python3 -c "import json,sys; prs=json.load(sys.stdin); print('EXISTS' if prs else 'OK')"

          If output is EXISTS, print "PR already open for #NUMBER — skipping." and stop.

          ## Step 3 — Create a branch

          Run:
            git checkout main && git pull origin main

          Branch name pattern: claude/fix-NUMBER-SLUG where SLUG = title lowercased, spaces→hyphens, max 5 words, no special chars.

          Run:
            git checkout -b claude/fix-NUMBER-SLUG

          ## Step 4 — Implement the fix

          Read ONLY the files directly relevant to the issue. Follow the fix suggested in the issue body/comments exactly. Obey these hard rules:
          - All user-facing strings must use _() / ngettext() in templates or gettext() in Python — never hardcode UI text
          - Flask routes must return render_template(...) — never jsonify
          - No JavaScript frameworks or external JS files
          - Never call Ollama directly — always go through app/llm/provider.py
          - Database access via app/db/ only — no raw SQL in routes or services
          - Do not refactor, improve, or touch code outside the fix scope

          ## Step 5 — Commit (non-interactive)

          Do NOT use cz commit — it is interactive. Use git commit -m directly; lefthook validates the format:

            git add CHANGED_FILES
            git commit -m "fix: CONCISE_DESCRIPTION

          ROOT_CAUSE_AND_FIX_IN_ONE_OR_TWO_SENTENCES

          Closes #NUMBER

          Co-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>"

          If lefthook fails, fix the errors and retry. Never use --no-verify.

          ## Step 6 — Push

            git push -u origin claude/fix-NUMBER-SLUG

          The pre-push hook runs all tests. If tests fail, fix them and retry the push.

          ## Step 7 — Ensure labels exist

            gh label list --repo etorhub/dossier | grep -q "^fix" || gh label create fix --repo etorhub/dossier --color 0e8a16 --description "Bug fix PR"

          ## Step 8 — Create the PR

            gh pr create \
              --repo etorhub/dossier \
              --title "fix: TITLE" \
              --body "Closes #NUMBER

          ## What

          ONE_SENTENCE_WHAT_CHANGED

          ## Why

          ONE_SENTENCE_ROOT_CAUSE

          Generated with Claude Code" \
              --assignee etorhub \
              --label bug \
              --label fix

          The Closes #NUMBER line automatically closes the issue when the PR merges to main.

          ## Step 9 — If genuinely stuck

          If the fix requires an architectural decision or is ambiguous: commit and push what you have, create the PR anyway, then run:

            gh pr comment PR_NUMBER --repo etorhub/dossier --body "**Human input needed**

          I have implemented what I can, but this requires a decision:

          SPECIFIC_QUESTION

          Remaining work is at FILE:LINE."

          Now begin. Work autonomously through all steps.
          PROMPT

      - name: Run fix-github-issue agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          RUFF_CACHE_DIR: /tmp/ruff-cache
        run: claude --dangerouslySkipPermissions --print < /tmp/agent-prompt.txt
