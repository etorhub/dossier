name: PR CI

# Runs on every pull request targeting a protected branch.
# Branch protection requires this check to pass before merging.

on:
  pull_request:
    branches: [main, master]

jobs:
  ci:
    name: Lint and test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test (pytest)
        run: uv run pytest --junitxml=test-results.xml

      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: success()
        with:
          name: pytest
          path: test-results.xml
          reporter: java-junit
