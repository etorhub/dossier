name: Build & push Pi images

# Triggers on every push to master.
# Builds arm64 images for the Pi and pushes them to GHCR.
# Watchtower on the Pi polls GHCR and redeploys automatically.

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to GHCR

    strategy:
      matrix:
        # Each target becomes a tag on the single ghcr.io/etorhub/dossier package.
        # The package name matches the repository name so GITHUB_TOKEN has automatic
        # write access without any manual package-linking step.
        target: [web, worker, ops]

    steps:
      - uses: actions/checkout@v4

      # QEMU lets the amd64 runner emulate arm64 for the build.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          # Tag format: ghcr.io/etorhub/dossier:web  (package name = repo name)
          tags: ghcr.io/${{ github.repository }}:${{ matrix.target }}
          provenance: false
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # GitHub Actions cache keeps layers between runs — speeds up rebuilds.
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
