# Raspberry Pi compose — web UI + light worker only.
# Database and LLM are external (Neon + dev machine).
#
# Images are built for arm64 by GitHub Actions on every push to master
# and pushed to GHCR. Watchtower polls GHCR and redeploys automatically.
#
# First-time setup on the Pi:
#   1. docker login ghcr.io -u <github-username>
#      (use a PAT with read:packages scope as the password)
#   2. cp .env.example .env && nano .env
#   3. docker compose -f docker-compose.pi.yml up -d
#
# After that, every push to master redeploys within ~1 minute.
#
# Required .env:
#   DATABASE_URL=postgresql://user:pass@ep-xxx.neon.tech/dossier?sslmode=require
#   SECRET_KEY=<strong-random-key>
#   GHCR_USERNAME=<github-username>
#   GHCR_TOKEN=<PAT with read:packages>

services:
  web:
    image: ghcr.io/etorhub/dossier-web:latest
    labels:
      - com.centurylinklabs.watchtower.scope=dossier
    ports:
      - '5000:5000'
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
    volumes:
      - ./config:/app/config
    # -w 1: single gunicorn worker to stay within Pi 3's 1GB RAM.
    command: sh -c "flask seed-sources && gunicorn -w 1 -b 0.0.0.0:5000 app:application"
    restart: unless-stopped

  worker:
    image: ghcr.io/etorhub/dossier-worker:latest
    labels:
      - com.centurylinklabs.watchtower.scope=dossier
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # Light mode: fetch_feeds, enrich_articles, check_source_availability only.
      # No LLM calls — OLLAMA_HOST is not required.
      SCHEDULER_MODE: light
    volumes:
      - ./config:/app/config
      - ./data/job_runs:/app/data/job_runs
    command: python -m app.scheduler
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Reuse the credentials from `docker login ghcr.io` run during setup.
      - ~/.docker:/config:ro
    environment:
      DOCKER_CONFIG: /config
      DOCKER_API_VERSION: '1.40'
      # Poll every 60 seconds. Adjust down to 30 if you want faster picks.
      WATCHTOWER_POLL_INTERVAL: '60'
      # Remove old images after pulling new ones (keeps the Pi disk clean).
      WATCHTOWER_CLEANUP: 'true'
      # Only watch these two containers, not watchtower itself.
      WATCHTOWER_SCOPE: dossier
    # Restrict to containers with the com.centurylinklabs.watchtower.scope=dossier label.
    command: --scope dossier
    restart: unless-stopped
