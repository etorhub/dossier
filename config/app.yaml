# Per-job-run log files (.log) for worker jobs; worker and ops must share this directory
# (see docker-compose volumes). Shown on Ops → Jobs → Log.
paths:
  job_run_logs: data/job_runs

llm:
  provider: ollama
  model: qwen2.5:7b # fallback for any task without its own model
  # Per-task models (cascade: rewrite → simplify → translate). Fall back to model when unset.
  rewrite_model: qwen2.5:7b # merge sources → neutral EN (hardest task, use best model)
  simplify_model: qwen2.5:3b # neutral EN → simple EN (smaller model is usually enough)
  translate_model: qwen2.5:3b # translate to other languages (faster than 7B)
  host: http://ollama:11434
  # Per-call retries for Ollama chat (transient errors)
  max_retries: 3
  # Per-call timeout in seconds for Ollama chat requests. Prevents hung LLM calls
  # from blocking rewrite workers indefinitely. Increase on slow hardware.
  request_timeout_seconds: 300
  # Sampling temperature per pipeline step (lower = more deterministic, fewer typos).
  rewrite_temperature: 0.2
  simplify_temperature: 0.2
  translate_temperature: 0.15
  proofread_temperature: 0.1

# Story-level rewriting: one rewrite per (story, style, language).
# Styles and languages are extensible via config.
# Cascade: generate neutral text in base_language from sources, then translate each
# configured style to each entry in languages other than base_language. (Optional
# style "simple" triggers an extra simplify step in base_language before translating.)
rewriting:
  base_language: es
  styles:
    - id: neutral
      label: Neutral
      prompt: rewrite_cluster_neutral
  languages:
    - id: es
      label: Spanish
      writing_note: European Spanish. Correct gender/number agreement; natural Spanish syntax (not English calques). Prefer standard financial vocabulary (e.g. valoración). Use suscriptores for paying followers, not subscriptores.
  # Fallback when user's preferred (style, language) is not yet available
  default_style: neutral
  default_language: es

embeddings:
  provider: ollama
  model: nomic-embed-text
  host: http://ollama:11434
  max_retries: 3
  max_input_chars: 8000

schedule:
  fetch_interval_minutes: 60
  # Pipeline order: fetch -> enrichment -> cluster -> rewrite
  enrichment_cron: '5 * * * *' # Hourly at :05 (after fetch at :00)
  cluster_cron: '15 * * * *' # Hourly at :15 (after enrichment)
  # Articles older than this are not fetched (0 = no limit)
  max_article_age_hours: 24
  rewrite_cron: '0 6 * * *' # Daily at 6am
  # Source feed availability check (HTTP HEAD/GET) — visible in ops dashboard
  availability_check_interval_minutes: 10
  # 0 = process every story needing rewrite in one run; >0 caps stories per run
  rewrite_batch_size: 0
  # Story-level thread pool. Use 1 with a single-GPU Ollama host: two concurrent rewrites
  # often blow VRAM and the GPU goes idle after a short spike. Raise only if Ollama has
  # headroom (see docker-compose OLLAMA_NUM_PARALLEL / GPU memory).
  rewrite_parallel_workers: 1
  fetcher:
    circuit_breaker_threshold: 5
    request_timeout_seconds: 30
    user_agent: 'Dossier/0.1 (+https://github.com/etorhub/dossier)'

extraction:
  enabled: true
  min_content_length: 200
  batch_size: 30
  max_enrichment_rounds: 20 # Cap per run to avoid runaway loops
  rate_limit_per_domain: 2.0
  timeout: 30
  # Articles stuck in 'pending' extraction longer than this are auto-abandoned (0 = never abandon)
  abandon_after_hours: 4
  # Cluster job is skipped if more than this many articles are still pending extraction.
  # Set to 0 to require zero pending (strictest gate, original behaviour).
  cluster_gate_max_pending: 5

# Reader feed: drop RSS items that look like native ads (matched in title + start of body).
feed:
  promoted_content:
    enabled: true
    body_prefix_chars: 400
    patterns:
      - contenido patrocinado
      - contingut patrocinat
      - con la colaboración de
      - con la colaboracion de
      - en colaboración con
      - en colaboracion con
      - sponsored content
      - paid partnership

processing:
  # 0 = no limit; show every story with a rewrite
  articles_per_day: 0
  summary_sentences: 2
  # Max tokens for rewrite output (TITLE/SUMMARY/FULL). Too low truncates FULL: and breaks parsing.
  rewrite_max_tokens: 4096
  # Keep merged-source prompts inside local LLM context (avoids hangs / empty replies). 0 = no limit.
  rewrite_max_sources_per_story: 18
  rewrite_max_chars_per_article: 8000
  rewrite_max_articles_text_chars: 52000
  # Extra LLM call per variant to fix spelling/grammar only; disable to reduce load/timeouts under parallel rewrite.
  rewrite_proofread_enabled: true
  # 0 = all stories regardless of freshness
  cluster_window_hours: 0
  # Minimum cosine similarity for two articles to belong to the same story.
  # Higher = stricter; only articles about the same specific event are grouped.
  # Recommended range: 0.88–0.95. Default: 0.90.
  story_similarity_threshold: 0.92
  story_min_sources: 2
  # 0 = embed every pending article in the window each cluster run; >0 caps per run
  embed_batch_size: 0

# Feed story ranking: non-behavioral only (no read history, clicks, or dwell time).
# topic_affinity is the only term tied to explicit user setup (selected topics).
relevance:
  weights:
    recency: 0.30 # Freshness from latest article published_at (exponential decay)
    coverage: 0.40 # Distinct outlets in the story (capped at coverage_cap)
    topic_affinity: 0.20 # Share of articles matching user's selected topics
    content_quality: 0.10 # Share of articles with full-text extraction
  recency_half_life_hours: 8
  coverage_cap: 4
  # 1 = single-source clusters same priority as multi-source
  min_sources: 1

server:
  port: 5000
  debug: false

# Topic labels, icons and emojis. Keys must match topic ids in sources.
# label: full display name (no abbreviations)
# icon: SVG icon name (newspaper, building, users, palette, globe, trending-up, flask, trophy)
# emoji: for setup/settings topic selector
topics:
  general: { label: General, icon: newspaper, emoji: '📰' }
  politics: { label: Politics, icon: building, emoji: '🏛️' }
  society: { label: Society, icon: users, emoji: '👥' }
  culture: { label: Culture, icon: palette, emoji: '🎭' }
  international: { label: International, icon: globe, emoji: '🌍' }
  economy: { label: Economy, icon: trending-up, emoji: '📈' }
  science: { label: Science, icon: flask, emoji: '🔬' }
  sports: { label: Sports, icon: trophy, emoji: '⚽' }
